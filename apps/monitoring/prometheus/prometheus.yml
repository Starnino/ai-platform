global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "transformer"
    metrics_path: /metrics
    static_configs:
      - targets: ["transformer:5001"]

  - job_name: "predictor"
    metrics_path: /metrics
    static_configs:
      - targets: ["predictor:5002"]