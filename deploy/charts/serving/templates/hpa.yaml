{{- define "serving.componentHPA" }}
{{- $name := index . 0 }}
{{- $comp := index . 1 }}
{{- $root := index . 2 | default $ -}}

{{- if and $comp.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fullname" $root }}-{{ $name }}
  labels:
    {{- include "labels" (list $root $name) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fullname" $root }}-{{ $name }}
  minReplicas: {{ $comp.autoscaling.minReplicas }}
  maxReplicas: {{ $comp.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $comp.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}

{{ include "serving.componentHPA" (list "gateway"     .Values.gateway     .) }}
{{ include "serving.componentHPA" (list "transformer" .Values.transformer .) }}
{{ include "serving.componentHPA" (list "predictor"   .Values.predictor   .) }}